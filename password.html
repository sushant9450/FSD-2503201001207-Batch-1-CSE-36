<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function check(){
    var uid=document.getElementById("userid").value;
    var pwd=document.getElementById("passwd").value;
    var msg="";

    if(uid.length<=0){
        msg+="username cannot be empty\n";
    }

    if(pwd.length<=0){
        msg+="password cannot be empty\n";
    }

    if(msg.length>0){
        alert(msg);
        return false;
    }

    if(pwd.length<8){
        alert("Password must be at least 8 characters long.");
        return false;
    }

    if(uid=="admin" && pwd=="password123"){
        alert("login successful!");
        return true;      // ya false agar submit nahi karna
    }else{
        alert("Invalid username or password.");
        return false;
    }
}
    </script>
</head>
<body>
    <form action=""method="post">
      <label for="username">Username:</label>
      <input type="text" id="userid" placeholder="Enter username"><br><br>
      <label for="password">Password:</label>
      <input type="password" id="passwd" placeholder="Enter password"><br><br>
      <input type="submit" value="Submit" onclick="check();">
    </form>
    
</body>
</html>
